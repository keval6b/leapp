name: Personal Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.27.0, no leading v)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --draft \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for details."

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build core
        run: |
          cd packages/core
          npm ci
          npm run build

      - name: Build Linux packages
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          cd packages/desktop-app
          npm ci
          npm run release-linux

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          gh release upload "v${VERSION}" \
            "packages/desktop-app/release/Leapp_${VERSION}_amd64.deb" \
            "packages/desktop-app/release/Leapp-${VERSION}.AppImage" \
            --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Build core
        shell: bash
        run: |
          cd packages/core
          npm ci
          npm run build

      - name: Build Windows package
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          cd packages/desktop-app
          npm ci
          npm run release-win

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          gh release upload "v${VERSION}" \
            "packages/desktop-app/release/Leapp Setup ${VERSION}.exe" \
            --clobber

  build-macos:
    needs: create-release
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build core
        run: |
          cd packages/core
          npm ci
          npm run build

      - name: Build macOS package
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd packages/desktop-app
          npm ci
          npm run release-mac

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          # Upload all DMGs produced (native arch of the runner)
          gh release upload "v${VERSION}" \
            packages/desktop-app/release/*.dmg \
            --clobber
